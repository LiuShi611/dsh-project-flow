<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand-tag"><span class="dot"></span>DSH PLUGIN</div>
    <div class="pageno">03 / 06</div>
  </div>
  <div class="body">
    <div class="kicker">02 · 五段在做什么</div>
    <h2 class="title">一条流水，<span class="hl">五段</span></h2>
    <div class="flow-note">第 1、5 段在主对话（问得了你、汇报得了你），中间三段在独立子会话。</div>

    <div class="flow">
      <div class="step main">
        <div class="step-num">1</div>
        <div class="step-box">
          <div class="step-hd"><span class="step-name">问意图</span><span class="step-tag">主对话</span></div>
          <div class="step-desc">一次只问一个问题，确认一份逐条可核对的要求清单。</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-box">
          <div class="step-hd"><span class="step-name">规划</span><span class="step-tag">子会话</span></div>
          <div class="step-desc">产出施工任务书：做什么、动哪些文件、顺序、验收标准、边界。</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-box">
          <div class="step-hd"><span class="step-name">实施</span><span class="step-tag">子会话</span></div>
          <div class="step-desc">只按任务书干活，不扩范围，输出自述：做了什么、改了哪些文件。</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-box">
          <div class="step-hd"><span class="step-name">自检</span><span class="step-tag">子会话</span></div>
          <div class="step-desc">职责是挑毛病。逐条对照任务书，不合格产出修正任务书打回第 3 段。</div>
        </div>
      </div>
      <div class="step main">
        <div class="step-num">5</div>
        <div class="step-box">
          <div class="step-hd"><span class="step-name">验收</span><span class="step-tag">主对话</span></div>
          <div class="step-desc">对照最初要求逐条核：哪几条做到、返工几次、代价与残留风险。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="foot">
    <span><b>dsh-project-flow</b> ／ 五段工作流</span>
    <span>03</span>
  </div>
</div>
</body>
</html>
