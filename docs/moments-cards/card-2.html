<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand-tag"><span class="dot"></span>DSH PLUGIN</div>
    <div class="pageno">02 / 06</div>
  </div>
  <div class="body">
    <div class="kicker">01 · 它解决什么问题</div>
    <h2 class="title">一条对话跑大任务，<span class="hl">三个麻烦</span></h2>
    <div class="sect-note">这个插件对着这三件事，各出一样东西。</div>

    <div class="prob">
      <div class="prob-row">
        <div class="prob-q">
          <div class="lb">麻烦 1</div>
          <div class="tx">上下文越跑越重，<br>前后互相污染</div>
        </div>
        <div class="arrow">→</div>
        <div class="prob-a">
          <div class="lb">对策</div>
          <div class="tx"><b>中间三段挪出主对话。</b><br>跑完即弃，只传任务书。</div>
        </div>
      </div>

      <div class="prob-row">
        <div class="prob-q">
          <div class="lb">麻烦 2</div>
          <div class="tx">中途出错，<br>就得从头再来</div>
        </div>
        <div class="arrow">→</div>
        <div class="prob-a">
          <div class="lb">对策</div>
          <div class="tx"><b>进度全部落在磁盘。</b><br>从中断那段接着跑。</div>
        </div>
      </div>

      <div class="prob-row">
        <div class="prob-q">
          <div class="lb">麻烦 3</div>
          <div class="tx">跑完了<br>才发现做错了</div>
        </div>
        <div class="arrow">→</div>
        <div class="prob-a">
          <div class="lb">对策</div>
          <div class="tx"><b>每次实施前后自动打快照。</b><br>退回去，回错了还能再退。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="foot">
    <span><b>dsh-project-flow</b> ／ 解决什么</span>
    <span>02</span>
  </div>
</div>
</body>
</html>
